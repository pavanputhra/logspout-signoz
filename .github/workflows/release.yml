name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # `latest` and the version tags move only when a git tag is pushed;
      # commits to main publish `edge`. v1 published `latest` on every commit to
      # main, which is what made a stale build reach users and why
      # versoin_bump.md existed.
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/logspout-signoz
          tags: |
            # Both forms. metadata-action strips the leading "v", but the docs,
            # the CHANGELOG and the frozen v1 tag all use it, so v-prefixed is
            # canonical; the bare form is published too so it cannot go stale
            # pointing at an old release.
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # No QEMU: the Dockerfile cross-compiles from the build platform and
          # the runtime stage contains no RUN instruction.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
