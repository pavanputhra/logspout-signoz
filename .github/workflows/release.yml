name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # `latest` and the version tags move only when a git tag is pushed;
      # commits to main publish `edge`. v1 published `latest` on every commit to
      # main, which is what made a stale build reach users and why
      # versoin_bump.md existed.
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/logspout-signoz
          tags: |
            # Both forms. metadata-action strips the leading "v", but the docs,
            # the CHANGELOG and the frozen v1 tag all use it, so v-prefixed is
            # canonical; the bare form is published too so it cannot go stale
            # pointing at an old release.
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # No QEMU: the Dockerfile cross-compiles from the build platform and
          # the runtime stage contains no RUN instruction.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Only for tags: main publishes `edge`, which is not a release.
  github-release:
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/logspout-signoz
        run: |
          set -eu
          version="${GITHUB_REF_NAME}"

          notes="$(sh scripts/changelog-section.sh "$version")"
          if [ -z "$notes" ]; then
            echo "CHANGELOG.md has no section for ${version}; add one before tagging." >&2
            exit 1
          fi

          {
            printf '%s\n\n' "$notes"
            printf '## Docker\n\n'
            printf '```bash\n'
            printf 'docker pull %s:%s\n' "$IMAGE" "$version"
            printf '```\n'
          } > "${RUNNER_TEMP}/notes.md"

          gh release create "$version" \
            --title "$version" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            --verify-tag

  # Docker Hub's overview is the landing page for most users, so keep it in
  # step with the README instead of letting it drift a major version behind.
  dockerhub-description:
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    # The overview is cosmetic and needs a token scoped for repository
    # metadata, which a push-only token is not. Never fail a release over it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Sync the Docker Hub overview
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: python3 scripts/sync-dockerhub-description.py
