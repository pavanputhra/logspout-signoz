name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./signoz/...

      - name: Test
        run: go test -race -timeout 5m ./signoz/...

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Builds the image the same way a release does, so a broken Dockerfile
      # fails the PR rather than the release.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: logspout-signoz:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          set -eux
          # The adapter must resolve its endpoint from the route address.
          docker run -d --name smoke \
            -v /var/run/docker.sock:/var/run/docker.sock \
            logspout-signoz:ci 'signoz://127.0.0.1:9?flush_interval=1s'
          sleep 5
          docker logs smoke
          docker logs smoke 2>&1 | grep -q 'signoz: routing to http://127.0.0.1:9/'
          docker rm -f smoke

          # An invalid option must stop the route instead of starting with a
          # silently wrong configuration.
          if docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
               logspout-signoz:ci 'signoz://127.0.0.1:9?batch_size=abc'; then
            echo "expected an invalid batch_size to be rejected"
            exit 1
          fi
